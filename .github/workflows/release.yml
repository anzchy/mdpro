name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          name: "mdpro ${{ steps.get-version.outputs.version }}"
          draft: true
          prerelease: false
          generate_release_notes: true

  build-tauri:
    needs: create-release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            sidecar_triple: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            tauri_args: ''
          - platform: macos-latest
            sidecar_triple: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            tauri_args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            sidecar_triple: x86_64-pc-windows-msvc
            rust_target: ''
            tauri_args: --bundles nsis
          - platform: ubuntu-22.04
            sidecar_triple: x86_64-unknown-linux-gnu
            rust_target: ''
            tauri_args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Extract version (strip leading v)
        id: version
        shell: bash
        env:
          RAW_VERSION: ${{ needs.create-release.outputs.version }}
        run: echo "VERSION=${RAW_VERSION#v}" >> $GITHUB_OUTPUT

      - name: Patch version in package.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const f = 'package.json';
            const p = JSON.parse(fs.readFileSync(f, 'utf8'));
            p.version = '${{ steps.version.outputs.VERSION }}';
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
          "

      - name: Patch version in tauri.conf.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.conf.json';
            const p = JSON.parse(fs.readFileSync(f, 'utf8'));
            p.version = '${{ steps.version.outputs.VERSION }}';
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
          "

      - name: Patch version in Cargo.toml
        shell: bash
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s/^version = \"[^\"]*\"/version = \"${{ steps.version.outputs.VERSION }}\"/" src-tauri/Cargo.toml
          else
            sed -i "s/^version = \"[^\"]*\"/version = \"${{ steps.version.outputs.VERSION }}\"/" src-tauri/Cargo.toml
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Create sidecar placeholder (macOS)
        if: runner.os == 'macOS'
        run: touch src-tauri/binaries/mdpro_mcp-${{ matrix.sidecar_triple }}

      - name: Create sidecar placeholder (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: touch "src-tauri/binaries/mdpro_mcp-${{ matrix.sidecar_triple }}.exe"

      - name: Create sidecar placeholder (Linux)
        if: runner.os == 'Linux'
        run: touch src-tauri/binaries/mdpro_mcp-${{ matrix.sidecar_triple }}

      - name: Build MCP sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          cd src-tauri
          cargo build --release --bin mdpro_mcp --target ${{ matrix.rust_target }}
          cp target/${{ matrix.rust_target }}/release/mdpro_mcp binaries/mdpro_mcp-${{ matrix.sidecar_triple }}

      - name: Build MCP sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd src-tauri
          cargo build --release --bin mdpro_mcp
          cp target/release/mdpro_mcp.exe "binaries/mdpro_mcp-${{ matrix.sidecar_triple }}.exe"

      - name: Build MCP sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          cd src-tauri
          cargo build --release --bin mdpro_mcp
          cp target/release/mdpro_mcp binaries/mdpro_mcp-${{ matrix.sidecar_triple }}

      - name: Health check MCP sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          SIDECAR="src-tauri/binaries/mdpro_mcp-${{ matrix.sidecar_triple }}"
          echo "Checking: $SIDECAR"
          ls -lh "$SIDECAR"
          file "$SIDECAR"

      - name: Health check MCP sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          SIDECAR="src-tauri/binaries/mdpro_mcp-${{ matrix.sidecar_triple }}.exe"
          echo "Checking: $SIDECAR"
          ls -lh "$SIDECAR"

      - name: Health check MCP sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          SIDECAR="src-tauri/binaries/mdpro_mcp-${{ matrix.sidecar_triple }}"
          echo "Checking: $SIDECAR"
          ls -lh "$SIDECAR"
          file "$SIDECAR"

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.tauri_args }}
          includeUpdaterJson: false

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          REPO="${{ github.repository }}"

          # Fetch release body for notes field
          NOTES=$(gh release view "$VERSION" --repo "$REPO" --json body -q '.body' || echo "")

          # Fetch all release assets as JSON
          ASSETS=$(gh release view "$VERSION" --repo "$REPO" --json assets -q '.assets')

          # Helper: find asset URL by name pattern
          find_url() { echo "$ASSETS" | jq -r --arg pat "$1" '.[] | select(.name | test($pat)) | .url' | head -1; }

          # Download .sig files to read their content
          mkdir -p sigs
          gh release download "$VERSION" --repo "$REPO" --pattern "*.app.tar.gz.sig" --dir sigs || true

          # macOS ARM64
          ARM_URL=$(find_url 'aarch64.*app\.tar\.gz$')
          ARM_SIG=""
          if [ -f sigs/mdpro_aarch64.app.tar.gz.sig ]; then
            ARM_SIG=$(cat sigs/mdpro_aarch64.app.tar.gz.sig)
          fi

          # macOS x86_64 (Tauri names this "x64", not "x86_64")
          X64_URL=$(find_url '(x86_64|x64).*app\.tar\.gz$')
          X64_SIG=""
          if [ -f sigs/mdpro_x64.app.tar.gz.sig ]; then
            X64_SIG=$(cat sigs/mdpro_x64.app.tar.gz.sig)
          fi

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build latest.json with jq — only include platforms that have assets
          PLATFORMS='{}'
          if [ -n "$ARM_URL" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$ARM_URL" --arg sig "$ARM_SIG" \
              '. + {"darwin-aarch64": {"url": $url, "signature": $sig}}')
          fi
          if [ -n "$X64_URL" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$X64_URL" --arg sig "$X64_SIG" \
              '. + {"darwin-x86_64": {"url": $url, "signature": $sig}}')
          fi

          # Strip v prefix for version field (CARGO_PKG_VERSION has no prefix)
          VERSION_NUM="${VERSION#v}"

          # Verify at least one macOS artifact exists before generating latest.json
          if [ -z "$ARM_URL" ] && [ -z "$X64_URL" ]; then
            echo "ERROR: No macOS updater artifacts found in release $VERSION"
            echo "This likely means the macOS builds failed. Skipping latest.json."
            exit 1
          fi

          jq -n \
            --arg version "$VERSION_NUM" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json

          echo "Generated latest.json:"
          cat latest.json

          # Upload to release
          gh release upload "$VERSION" latest.json --repo "$REPO" --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.create-release.outputs.version }}" \
            --draft=false \
            --repo "${{ github.repository }}"
          echo "Published release ${{ needs.create-release.outputs.version }}"

      - name: Clean up old releases (keep latest 2)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=2
          OLD_TAGS=$(gh release list --repo "${{ github.repository }}" \
            --exclude-drafts --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .['$KEEP':][].tagName')
          if [ -z "$OLD_TAGS" ]; then
            echo "No old releases to clean up"
            exit 0
          fi
          for tag in $OLD_TAGS; do
            echo "Deleting release $tag..."
            gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes
          done
