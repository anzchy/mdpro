name: Release

# Manual dispatch only (D76, ADR-0073, which records why). One fail-closed run: preflight → build → verify → draft
# (not build-only) → publish (mode=draft only, after verify-release + gate.mjs may-publish pass). Shape: tests/tooling/release-workflow-*.test.ts.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to release: a 40-hex SHA or exactly the vX.Y.Z tag'
        required: true
        type: string
      version:
        description: 'X.Y.Z; must equal package.json, tauri.conf.json and Cargo.toml at ref'
        required: true
        type: string
      mode:
        description: 'build-only: build + verify. draft: also draft, re-verify, publish. rehearsal-draft: draft rehearsal-d76-<sha7>, never published'
        required: true
        type: choice
        default: build-only
        options:
          - build-only
          - draft
          - rehearsal-draft

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check source, tag and the three version files
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
        run: node scripts/release/check-source.mjs --ref "$REF" --version "$VERSION" --mode "$MODE"

  build:
    needs: preflight
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # platform/triple = scripts/release/assetNames.mjs; bundles pinned so the set stays closed.
        include:
          - os: macos-latest
            platform: darwin-aarch64
            sidecar_triple: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            platform: darwin-x86_64
            sidecar_triple: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            platform: windows-x86_64
            sidecar_triple: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux-x86_64
            sidecar_triple: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Assert the checkout is the preflight SHA
        shell: bash
        env:
          SHA: ${{ needs.preflight.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Refuse to build without the signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is empty; refusing an unsigned build"
            exit 1
          fi
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.rust_target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create sidecar placeholder (macOS)
        if: runner.os == 'macOS'
        run: touch src-tauri/binaries/mdpro_mcp-${{ matrix.sidecar_triple }}
      - name: Create sidecar placeholder (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: touch "src-tauri/binaries/mdpro_mcp-${{ matrix.sidecar_triple }}.exe"
      - name: Create sidecar placeholder (Linux)
        if: runner.os == 'Linux'
        run: touch src-tauri/binaries/mdpro_mcp-${{ matrix.sidecar_triple }}
      - name: Build MCP sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          cd src-tauri
          cargo build --release --bin mdpro_mcp --target ${{ matrix.rust_target }}
          cp target/${{ matrix.rust_target }}/release/mdpro_mcp binaries/mdpro_mcp-${{ matrix.sidecar_triple }}
      - name: Build MCP sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd src-tauri
          cargo build --release --bin mdpro_mcp
          cp target/release/mdpro_mcp.exe "binaries/mdpro_mcp-${{ matrix.sidecar_triple }}.exe"
      - name: Build MCP sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          cd src-tauri
          cargo build --release --bin mdpro_mcp
          cp target/release/mdpro_mcp binaries/mdpro_mcp-${{ matrix.sidecar_triple }}
      - name: Health check MCP sidecar
        shell: bash
        run: |
          SIDECAR="src-tauri/binaries/mdpro_mcp-${{ matrix.sidecar_triple }}"
          if [ "$RUNNER_OS" = Windows ]; then SIDECAR="$SIDECAR.exe"; fi
          echo "Checking: $SIDECAR"
          ls -lh "$SIDECAR"
          if [ "$RUNNER_OS" != Windows ]; then file "$SIDECAR"; fi
      - name: Build and sign (uploads nothing)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MDPRO_RELEASE_ID: ${{ needs.preflight.outputs.version }}@${{ needs.preflight.outputs.sha }} # D175: app.ready releaseId; app build only, never the sidecar
        run: pnpm tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}
      - name: Collect assets under their final names
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release/collect-assets.mjs --platform ${{ matrix.platform }} --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: dist-release/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts
      - name: Verify the set, the signatures and latest.json
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          MODE: ${{ inputs.mode }}
        run: node scripts/release/verify-assets.mjs --dir artifacts --version "$VERSION" --mode "$MODE" --out dist-release/release-set
      - uses: actions/upload-artifact@v4
        with:
          name: release-set
          path: dist-release/release-set/
          if-no-files-found: error
          retention-days: 3

  draft:
    needs: [preflight, verify]
    if: inputs.mode != 'build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ needs.preflight.outputs.sha }}
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-set
          path: dist-release/release-set
      - name: Decide, re-listing every release for the tag (drafts included)
        id: decide
        env:
          MODE: ${{ inputs.mode }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SOURCE_RESULT: ${{ needs.preflight.result }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [ "$MODE" = rehearsal-draft ]; then tag="rehearsal-d76-${SHA:0:7}"; fi
          found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.tag_name) draft=\(.draft)\"")
          existing=false
          if [ -n "$found" ]; then existing=true; echo "::error::a release already exists: $found"; fi
          verify=fail; [ "$VERIFY_RESULT" = success ] && verify=ok
          source=fail; [ "$SOURCE_RESULT" = success ] && source=ok
          node scripts/release/gate.mjs decide --mode "$MODE" --verify "$verify" --source "$source" \
            --sha "$SHA" --tag "$TAG" --published-for-tag "$existing"
      - name: Create the draft pinned to the SHA and upload the verified set
        env:
          DRAFT_TAG: ${{ steps.decide.outputs.draft_tag }}
        run: |
          set -euo pipefail
          node -e 'process.stdout.write(require("./dist-release/release-set/latest.json").notes)' > dist-release/notes.md
          gh release create "$DRAFT_TAG" --draft --target "$SHA" \
            --title "mdpro $DRAFT_TAG" --notes-file dist-release/notes.md dist-release/release-set/*
      - name: Check the uploaded draft against manifest.json
        env:
          DRAFT_TAG: ${{ steps.decide.outputs.draft_tag }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$DRAFT_TAG\" and .draft) | .assets[] | {name, size, digest}" \
            | jq -s . > dist-release/draft-assets.json
          node scripts/release/gate.mjs post-upload --manifest dist-release/release-set/manifest.json \
            --assets dist-release/draft-assets.json

  publish:
    needs: [preflight, draft]
    if: inputs.mode == 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ needs.preflight.outputs.sha }}
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Re-verify the uploaded draft (target, bytes, signatures)
        id: verify_release
        run: node scripts/release/verify-release.mjs --tag "$TAG" --sha "$SHA"
      - name: Gate the publish
        env:
          MODE: ${{ inputs.mode }}
          POST_UPLOAD: ${{ needs.draft.result }}
          VERIFY_RELEASE: ${{ steps.verify_release.outcome }}
        run: |
          set -euo pipefail
          post=fail; [ "$POST_UPLOAD" = success ] && post=ok
          vr=fail; [ "$VERIFY_RELEASE" = success ] && vr=ok
          node scripts/release/gate.mjs may-publish --mode "$MODE" --tag "$TAG" --post-upload "$post" --verify-release "$vr"
      - name: Publish (the one publish call)
        run: gh release edit "$TAG" --draft=false
