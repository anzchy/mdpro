name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version in tauri.conf.json
        run: |
          sed -i '' 's/"version": "[^"]*"/"version": "${{ steps.version.outputs.VERSION }}"/' src-tauri/tauri.conf.json
          cat src-tauri/tauri.conf.json | grep version

      - name: Update version in Cargo.toml
        run: |
          sed -i '' 's/^version = "[^"]*"/version = "${{ steps.version.outputs.VERSION }}"/' src-tauri/Cargo.toml
          head -5 src-tauri/Cargo.toml

      - name: Install dependencies
        run: pnpm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "mdpro ${{ github.ref_name }}"
          releaseBody: "Automated build"
          releaseDraft: false
          prerelease: false

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version in tauri.conf.json
        shell: pwsh
        run: |
          $content = Get-Content src-tauri/tauri.conf.json -Raw
          $content = $content -replace '"version": "[^"]*"', '"version": "${{ steps.version.outputs.VERSION }}"'
          Set-Content src-tauri/tauri.conf.json $content
          Get-Content src-tauri/tauri.conf.json | Select-String "version"

      - name: Update version in Cargo.toml
        shell: pwsh
        run: |
          $content = Get-Content src-tauri/Cargo.toml -Raw
          $content = $content -replace '^version = "[^"]*"', 'version = "${{ steps.version.outputs.VERSION }}"'
          Set-Content src-tauri/Cargo.toml $content
          Get-Content src-tauri/Cargo.toml | Select-Object -First 5

      - name: Install dependencies
        run: pnpm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "mdpro ${{ github.ref_name }}"
          releaseBody: "Automated build"
          releaseDraft: false
          prerelease: false
