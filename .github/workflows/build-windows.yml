name: build-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 0.2.4). Defaults to version in package.json."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      # Disable incremental compilation in CI — it bloats the cache without
      # benefit (each run starts from a restored snapshot, not a previous run).
      CARGO_INCREMENTAL: "0"
      # Parallel codegen units: release default is 1 (maximum optimisation,
      # minimum parallelism). 16 unlocks multi-core codegen at the cost of
      # ~5 % larger binary — acceptable for a desktop app, saves 2–4 min.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # Thin LTO: faster than fat LTO (default off), still eliminates dead
      # code across crate boundaries. Pair with codegen-units > 1.
      CARGO_PROFILE_RELEASE_LTO: "thin"

    steps:
      - uses: actions/checkout@v4

      # ── Node / pnpm ──────────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24          # node 20 reaches EOL Oct 2026; 24 is the LTS
          cache: "pnpm"             # caches the pnpm store between runs

      # ── Rust toolchain ───────────────────────────────────────────────────────
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches:
      #   ~/.cargo/registry  – downloaded crate tarballs
      #   ~/.cargo/git       – git-sourced crates
      #   src-tauri/target   – compiled artefacts (keyed on Cargo.lock hash)
      # On a warm cache this step alone cuts 10–12 min of compilation.
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true        # keep cache even if the build fails
          shared-key: "windows-release" # share cache across branches

      # ── Version resolution ───────────────────────────────────────────────────
      - name: Resolve version
        id: version
        shell: bash
        run: |
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            echo "VERSION=$INPUT" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      # Resolve while the checkout is still clean. The following manifest
      # patches may change tracked files; only the app build receives this ID.
      - name: Resolve development release ID
        id: dev-release-id
        shell: bash
        run: |
          release_id="$(node scripts/release/devReleaseId.mjs --version "${{ steps.version.outputs.VERSION }}")" || exit 1
          echo "RELEASE_ID=$release_id" >> "$GITHUB_OUTPUT"
          echo "SHA7=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Patch version in tauri.conf.json
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          $content = Get-Content src-tauri/tauri.conf.json -Raw
          $content = $content -replace '"version": "[^"]*"', "`"version`": `"$v`""
          Set-Content src-tauri/tauri.conf.json $content
          Write-Host "tauri.conf.json version: $v"

      - name: Patch version in Cargo.toml
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          $content = Get-Content src-tauri/Cargo.toml -Raw
          $content = $content -replace '(?m)^version = "[^"]*"', "version = `"$v`""
          Set-Content src-tauri/Cargo.toml $content
          Write-Host "Cargo.toml version: $v"

      # ── JS dependencies (runs while Rust cache is warm) ──────────────────────
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust builds ─────────────────────────────────────────────────────────
      # Build the sidecar first. All shared dependency artefacts compiled here
      # are reused by the main tauri-app build immediately after.
      - name: Build mdpro_mcp sidecar (Windows x64)
        shell: bash
        run: |
          touch src-tauri/binaries/mdpro_mcp-x86_64-pc-windows-msvc.exe
          cd src-tauri
          cargo build --release --bin mdpro_mcp
          cp target/release/mdpro_mcp.exe binaries/mdpro_mcp-x86_64-pc-windows-msvc.exe

      # tauri.conf.json carries the updater public key, so the bundler refuses
      # to build without the matching private key (same secrets as release.yml).
      - name: Build NSIS installer
        shell: bash
        env:
          MDPRO_RELEASE_ID: ${{ steps.dev-release-id.outputs.RELEASE_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      # ── Publish ──────────────────────────────────────────────────────────────
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: mdpro-windows-${{ steps.version.outputs.VERSION }}-dev-${{ steps.dev-release-id.outputs.SHA7 }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
