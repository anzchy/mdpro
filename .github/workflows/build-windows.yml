name: build-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 0.2.4). Defaults to version in package.json."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            echo "VERSION=$INPUT" >> $GITHUB_OUTPUT
          else
            # Read from package.json
            VERSION=$(node -p "require('./package.json').version")
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Patch version in tauri.conf.json
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          $content = Get-Content src-tauri/tauri.conf.json -Raw
          $content = $content -replace '"version": "[^"]*"', "`"version`": `"$v`""
          Set-Content src-tauri/tauri.conf.json $content
          Write-Host "tauri.conf.json version: $v"

      - name: Patch version in Cargo.toml
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          $content = Get-Content src-tauri/Cargo.toml -Raw
          $content = $content -replace '^version = "[^"]*"', "version = `"$v`""
          Set-Content src-tauri/Cargo.toml $content
          Write-Host "Cargo.toml version: $v"

      - name: Install JS dependencies
        run: pnpm install

      - name: Build mdpro_mcp sidecar (Windows x64)
        shell: bash
        run: |
          touch src-tauri/binaries/mdpro_mcp-x86_64-pc-windows-msvc.exe
          cd src-tauri
          cargo build --release --bin mdpro_mcp
          cp target/release/mdpro_mcp.exe binaries/mdpro_mcp-x86_64-pc-windows-msvc.exe

      - name: Build NSIS installer
        shell: bash
        run: pnpm tauri build --bundles nsis

      - name: Upload NSIS installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdpro-windows-${{ steps.version.outputs.VERSION }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
