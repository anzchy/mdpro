name: Claude Code
on:
  workflow_dispatch:       # manual trigger from Actions tab
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# NOTE: The scheduled audit-fix job and its ungated auto-merge step were removed
# (plan WI-0 + WI-12). cc-audit-fix.yml is now the sole fixer. This workflow only
# runs the general @claude assistant / PR review, gated to trusted authors (WI-11).

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # General Claude assistant: PR review, @claude mentions, issue responses.
  # Gated (WI-11): only trusted authors (OWNER/MEMBER/COLLABORATOR) or bot fix PRs
  # can invoke this write-capable agent, so an arbitrary issue/comment cannot.
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    if: >-
      (github.event_name == 'issues' &&
        !contains(github.event.issue.labels.*.name, 'audit') &&
        !contains(github.event.issue.labels.*.name, 'cost-report') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request' &&
        (github.event.pull_request.user.login == 'claude[bot]' ||
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) ||
      (github.event_name == 'issue_comment' &&
        !github.event.comment.performed_via_github_app &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        !github.event.comment.performed_via_github_app &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: "--model claude-opus-4-6 --max-turns 15"
          use_sticky_comment: true
          include_fix_links: true
