name: Claude Code
on:
  schedule:
    - cron: "0 * * * *"   # hourly: process one audit issue per run
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: ["Claude Periodic Audit"]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # Auto-fix all open audit issues after the auditor completes
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: audit-fix
      cancel-in-progress: false
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'audit')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm and dependencies
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Find open audit issues
        id: find-issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "ISSUE_NUMBERS=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            # Pick only the oldest open audit issue (ascending by created date, take first)
            NUMBER=$(gh issue list --state open --label audit \
              --json number,createdAt \
              --jq 'sort_by(.createdAt) | .[0].number // empty')
            echo "ISSUE_NUMBERS=$NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Fix audit issues
        if: steps.find-issues.outputs.ISSUE_NUMBERS != ''
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "claude[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --model claude-opus-4-6
            --max-turns 25
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,MultiEdit
          prompt: |
            Fix audit issue #${{ steps.find-issues.outputs.ISSUE_NUMBERS }}.

            1. Read the issue: `gh issue view ${{ steps.find-issues.outputs.ISSUE_NUMBERS }}`
            2. Create a fix branch: `git checkout -b fix/audit-${{ steps.find-issues.outputs.ISSUE_NUMBERS }}`
            3. Apply the minimum correct fix described in the issue
            4. Run frontend gate: `pnpm build`
            5. If the fix touches .rs files: `cd src-tauri && cargo check --manifest-path src-tauri/Cargo.toml`
            6. If tests are relevant: `pnpm test:run`
            7. Commit: `git commit -m "fix: <issue title> (Closes #${{ steps.find-issues.outputs.ISSUE_NUMBERS }})"`
            8. Push branch: `git push origin fix/audit-${{ steps.find-issues.outputs.ISSUE_NUMBERS }}`
            9. Open PR: `gh pr create --title "fix: <issue title>" --body "Closes #${{ steps.find-issues.outputs.ISSUE_NUMBERS }}" --label audit`

            Rules:
            - Apply minimum correct fix — don't refactor beyond the finding
            - If a fix requires touching more than 3 files, comment on the issue explaining
              why and skip (leave for human review)
            - If gates fail after 2 attempts, comment on the issue and move on
            - Never commit to master directly

  # General Claude assistant: PR review, @claude mentions, issue responses
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    if: >-
      (github.event_name == 'issues' && !contains(github.event.issue.labels.*.name, 'audit') && !contains(github.event.issue.labels.*.name, 'cost-report')) ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' &&
        !github.event.comment.performed_via_github_app &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        !github.event.comment.performed_via_github_app &&
        contains(github.event.comment.body, '@claude'))
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-4-6
            --max-turns 15
          use_sticky_comment: true
          include_fix_links: true

      - name: Enable auto-merge for bot PRs
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'claude[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash 2>&1 || true
