name: Claude Code

on:
  # MANUAL ONLY: the @claude interactive triggers (issue_comment, issues,
  # pull_request_review, pull_request_review_comment) were removed to cut
  # Actions spend. Dispatch from the Actions tab with an explicit prompt —
  # there is no triggering comment body for Claude to read.
  workflow_dispatch:
    inputs:
      prompt:
        description: "What Claude should do."
        required: true

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Required now that this workflow is dispatch-only: with no triggering
          # comment, the prompt has to come from the dispatch input.
          prompt: ${{ inputs.prompt }}

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

