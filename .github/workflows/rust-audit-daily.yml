name: Rust audit (daily)
# ADR-0107: RustSec publishes advisories against Cargo.lock at any time, and
# ci.yml runs only for pull requests, `v*` tags and manual dispatch. This runs
# the same `cargo audit` as ci.yml's rust-audit job on master once a day, so an
# advisory is seen before the next release tag rather than at it. It is its own
# workflow so a scheduled run executes nothing else. A failure shows only in
# the Actions tab and GitHub's failed-run email, not on any pull request.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# GH640: rust-audit restores this cargo-audit from actions/cache and compiles
# it (137–172 s) only on a miss. ci.yml and rust-audit-daily.yml pin the same
# version and cache key. On master, this job is the only writer of master's
# entry: on a miss it saves the fresh build, and ci.yml restores it without
# saving. A dispatch on any other ref never saves. Bump both files together.
env:
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  rust-audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # Only the binary: the rest of ~/.cargo/bin is rustup's proxies. No
      # restore-keys, so a version bump never restores the old binary.
      - id: cargo-audit-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"

      # Master's entry has this one writer. It saves right after a miss install,
      # before the audit, so a red audit (an open advisory) still seeds it, and
      # only on master: a dispatch on another branch never seeds that branch's
      # scope, which its PRs would restore first.
      - name: Save cargo-audit to the cache
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      # A mismatched binary fails here, not as a vacuous audit. It cannot catch a
      # tampered binary that prints the right string: master's entry is written
      # only by the daily job on master, but a PR's own earlier revisions can
      # write its own scope (#645). The subcommand answers as `cargo-audit-audit`.
      - name: Check the cargo-audit version
        run: |
          actual="$(cargo audit --version)"
          echo "$actual"
          test "$actual" = "cargo-audit-audit $CARGO_AUDIT_VERSION"

      # src-tauri/.cargo/audit.toml lists the advisories accepted as unreachable.
      - name: Security audit (Rust)
        run: cargo audit
        working-directory: src-tauri
