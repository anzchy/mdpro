name: CI
on:
  # Tests gate pull requests and `v*` tags, not pushes to master. master is
  # reached by the delegator's fast-forward push after each local landing
  # (ADR-0083), and that push deliberately runs nothing: the local lanes and the
  # landing verifier gate every landing, and the `v*` tag build runs this
  # workflow on every release. The one daily check on master, `cargo audit`,
  # lives in rust-audit-daily.yml (ADR-0107), so this workflow has no
  # `schedule` trigger; a Linux canary, if wanted, would follow that pattern
  # rather than run per push.
  #
  # The default `pull_request` types are [opened, synchronize, reopened], and
  # `synchronize` is the one that matters — it fires on every push to the PR
  # branch, which is what makes this a per-push gate rather than a per-PR one.
  pull_request:
  push:
    tags: ['v*']
  # A manual run names the commit the journey catalogue is compared against
  # (scripts/journeys/check.mjs); there is no event to take it from.
  workflow_dispatch:
    inputs:
      base:
        description: Base commit for the journey-catalogue history check
        required: true
        type: string

# A new push to the same PR cancels the run still in flight. Only the tip
# commit's result is worth having, and this is where most of the saving is.
# Tag builds are excluded from cancellation: a release must not be interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# GH640: rust-audit restores this cargo-audit from actions/cache and compiles
# it (137–172 s) only on a miss. ci.yml and rust-audit-daily.yml pin the same
# version and cache key. This workflow restores the entry and never saves it;
# master's entry is written only by the daily job on master. Bump both files
# together.
env:
  CARGO_AUDIT_VERSION: "0.22.2"

# ADR-0095: branch protection requires one check, `ci-gate`. `scope` decides
# whether the PR touches anything but prose; `frontend` (with its merge job,
# `frontend-merge`) and `rust-test` skip for a prose-only PR, and `ci-gate`
# reports every job's result as one check, so a skipped job never leaves a
# required check pending. The frontend coverage runs in shards and is gated
# once, after merging (ADR-0130 Decision 1).
jobs:
  scope:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        name: Classify the change (prose-only skips the heavy jobs)
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Outside a pull request (tags, manual runs) BASE is empty, and the
        # script answers code=true.
        run: node scripts/ci/change-scope.mjs "$BASE" "$HEAD"

  prose-checks:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # Full history: the journey check compares the catalogue with a base
      # commit (the PR's base, the previous v* tag, or the manual `base` input)
      # and fails, never skips, when that commit is missing (ADR-0103).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/ledger/check.mjs
      - run: node scripts/journeys/check.mjs

  frontend:
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (startsWith(github.ref, 'refs/tags/v') && fromJSON('["ubuntu-latest", "macos-latest"]')) || fromJSON('["ubuntu-latest"]') }}
        # ADR-0130 Decision 1 (GH639): four shards per runner, merged by
        # frontend-merge. Vitest splits by file count. The matrix cannot read
        # an env value, so keep this list, every `/4` and every `4` passed to
        # shard-reports.mjs equal; a shape test pins them together.
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/checkout@v6
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # version read from package.json "packageManager" (single source of truth)

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=critical
        continue-on-error: true

      - run: pnpm build

      - run: pnpm typecheck:tests

      - run: node scripts/lint/conditional-tests.mjs

      - run: git rev-parse HEAD

      - id: runner-profile
        name: Detect frontend runner prerequisites
        run: echo "profile=$(node scripts/ci/runner-profile.mjs)" >> "$GITHUB_OUTPUT"

      # A shard checks vitest's global thresholds against its own partial
      # coverage, so its thresholds are 0 here; frontend-merge enforces
      # vitest.config.ts's thresholds on the merged coverage.
      - run: pnpm exec vitest run --coverage --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0 --shard=${{ matrix.shard }}/4 --reporter=default --reporter=blob --reporter=json --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}-4.json --outputFile.json=.ci-vitest-results.json

      # The merge job checks this metadata against the artifact's name and its
      # own commit before merging the blob.
      # The profile reaches the shell through env, never as an expression
      # inside run:, and describe refuses one compare-report.mjs would not.
      - run: node scripts/ci/shard-reports.mjs describe "${{ matrix.os }}" "${{ matrix.shard }}" 4 "${{ github.run_attempt }}" "$PROFILE" "$(git rev-parse HEAD)" > .ci-shard.json
        env:
          PROFILE: ${{ steps.runner-profile.outputs.profile }}

      # Success only, so frontend-merge never sees a failed shard's blob. The
      # name carries the run attempt: a re-run shard adds a newer artifact
      # instead of colliding, and shard-reports.mjs takes the newest attempt.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-blob-${{ matrix.os }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            .vitest-reports
            .ci-shard.json
            .ci-vitest-results.json
          include-hidden-files: true
          if-no-files-found: error

      # ci-gate's failure summary reads every frontend-vitest-* artifact, so a
      # failed shard's tests are listed. One name per shard; a re-run replaces it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-vitest-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: .ci-vitest-results.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  # ADR-0130 Decision 1 (GH639): merges each runner's shard blobs, and proves
  # the merged started identities equal the union of the shards' same-process
  # JSON reports. With no status function in `if`,
  # GitHub adds success(): a failed, cancelled or skipped shard skips this job,
  # and ci-gate fails on that skip because scope said code=true. The coverage
  # thresholds, the critical floors and the inventory run here, on the merged
  # result only, never on one shard's.
  frontend-merge:
    needs: [scope, frontend]
    if: needs.scope.outputs.code == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (startsWith(github.ref, 'refs/tags/v') && fromJSON('["ubuntu-latest", "macos-latest"]')) || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # The same commit the shards ran, so the inventory, the critical globs
      # and the test file list match their tree. No history is needed here.
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/checkout@v6
        if: github.event_name != 'pull_request'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every attempt's blob artifacts for this runner, one folder each.
      - uses: actions/download-artifact@v4
        with:
          pattern: frontend-blob-${{ matrix.os }}-*
          path: .vitest-blobs

      # Fails unless each shard has a blob from this commit; takes each
      # shard's newest attempt and the profile the shards ran under. The
      # assignment, not `echo "$(...)"`, lets a failed collect fail the step.
      - id: shards
        name: Collect the newest blob of each shard
        run: |
          profile="$(node scripts/ci/shard-reports.mjs collect .vitest-blobs .vitest-reports 4 "${{ matrix.os }}" "$(git rev-parse HEAD)")"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      # Enforces vitest.config.ts's coverage thresholds on the merged coverage.
      - run: pnpm exec vitest --merge-reports --coverage --reporter=default --reporter=json --outputFile.json=.ci-vitest-results.json

      - run: node scripts/ci/check-critical-coverage.mjs

      - run: node scripts/ci/compare-report.mjs ci .ci-vitest-results.json tests/ci-inventory.json "$PROFILE" "$PWD"
        env:
          PROFILE: ${{ steps.shards.outputs.profile }}

      # Every test file vitest would run, so a file no shard ran fails the check.
      - run: pnpm exec vitest list --filesOnly --json=.ci-vitest-files.json

      - run: node scripts/ci/shard-reports.mjs check .vitest-blobs 4 "${{ matrix.os }}" .ci-vitest-results.json .ci-vitest-files.json "$PWD"

      # Every selected shard artifact carries its run's JSON report. Compare
      # its started identity union with the merged started tests.
      - run: node scripts/ci/shard-reports.mjs union .vitest-blobs 4 "${{ matrix.os }}" .ci-vitest-results.json "$PWD"

      # The merged per-leg report, under the name the single job used, for the
      # delegator's cross-host parity proof and the failure summary. A re-run
      # merge replaces it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-vitest-${{ matrix.os }}
          path: .ci-vitest-results.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  rust-test:
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (startsWith(github.ref, 'refs/tags/v') && fromJSON('["ubuntu-latest", "macos-latest"]')) || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-test-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-test-${{ runner.os }}-

      - name: Create sidecar stub for build.rs
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            touch src-tauri/binaries/mdpro_mcp-aarch64-apple-darwin
          else
            touch src-tauri/binaries/mdpro_mcp-x86_64-unknown-linux-gnu
          fi

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # ADR-0047 WI-009: the control-channel build compiles here too. On
      # ubuntu-latest this is the non-macOS arm of its cfg split.
      - run: cargo check --manifest-path src-tauri/Cargo.toml --features control-channel

  # ADR-0107: cargo audit runs on its own and is not in ci-gate's `needs`. A
  # new RustSec advisory says nothing about the diff under review, so on a PR
  # it shows as a red check without blocking the landing; on a tag or manual
  # run the failed job turns the run red. src-tauri/.cargo/audit.toml lists
  # the advisories accepted as unreachable, each with its reason.
  rust-audit:
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # Only the binary: the rest of ~/.cargo/bin is rustup's proxies. No
      # restore-keys, so a version bump never restores the old binary. This file
      # only restores: master's entry is written only by rust-audit-daily.yml on
      # master, and a PR with no entry of its own reads master's. A PR's own
      # earlier revisions can still write its own scope, which a later run of
      # that PR restores; that residual is accepted and tracked on #645.
      - id: cargo-audit-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"

      # A mismatched binary fails here, not as a vacuous audit. It cannot catch a
      # tampered binary that prints the right string: master's entry is written
      # only by the daily job on master, but a PR's own earlier revisions can
      # write its own scope (#645). The subcommand answers as `cargo-audit-audit`.
      - name: Check the cargo-audit version
        run: |
          actual="$(cargo audit --version)"
          echo "$actual"
          test "$actual" = "cargo-audit-audit $CARGO_AUDIT_VERSION"

      - name: Security audit (Rust)
        run: cargo audit
        working-directory: src-tauri

  ci-gate:
    needs: [scope, prose-checks, frontend, frontend-merge, rust-test]
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded, or skipped for a prose-only change
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        # scope and prose-checks must succeed. frontend, frontend-merge and rust-test must
        # succeed, or be skipped because scope said code=false. A failure,
        # a cancellation, or a skip that scope did not ask for fails the gate.
        run: |
          # NEEDS holds toJSON(needs), set in env above (not inlined here).
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            (.scope.result == "success") and
            (.["prose-checks"].result == "success") and
            ([.frontend.result, .["frontend-merge"].result, .["rust-test"].result] | all(. == "success" or
              (. == "skipped" and $code == "false")))
          ' --arg code "$(echo "$NEEDS" | jq -r '.scope.outputs.code')" >/dev/null \
            || { echo "ci-gate: a job ended in failure, was cancelled, or skipped without scope's code=false"; exit 1; }

      # ci-gate now resolves two actions at setup; resolution failure fails closed (blocks, never passes).
      - uses: actions/checkout@v6
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2

      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          pattern: frontend-vitest-*
          path: .ci-vitest-artifacts

      - name: Summarize failed jobs and tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/failure-summary.mjs .ci-vitest-artifacts
