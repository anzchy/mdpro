name: CI
on:
  # Tests gate pull requests and `v*` tags, not pushes to master. master is
  # reached by the delegator's fast-forward push after each local landing
  # (ADR-0083), and that push deliberately runs nothing: the local lanes and the
  # landing verifier gate every landing, and the `v*` tag build runs this
  # workflow on every release. If a Linux canary on master is wanted, add a
  # daily `schedule` trigger, not a per-push one.
  #
  # The default `pull_request` types are [opened, synchronize, reopened], and
  # `synchronize` is the one that matters — it fires on every push to the PR
  # branch, which is what makes this a per-push gate rather than a per-PR one.
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

# A new push to the same PR cancels the run still in flight. Only the tip
# commit's result is worth having, and this is where most of the saving is.
# Tag builds are excluded from cancellation: a release must not be interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (startsWith(github.ref, 'refs/tags/v') && fromJSON('["ubuntu-latest", "macos-latest"]')) || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        # version read from package.json "packageManager" (single source of truth)

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=critical
        continue-on-error: true

      - run: pnpm build

      - run: pnpm test:run

  rust-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (startsWith(github.ref, 'refs/tags/v') && fromJSON('["ubuntu-latest", "macos-latest"]')) || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-test-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-test-${{ runner.os }}-

      - name: Create sidecar stub for build.rs
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            touch src-tauri/binaries/mdpro_mcp-aarch64-apple-darwin
          else
            touch src-tauri/binaries/mdpro_mcp-x86_64-unknown-linux-gnu
          fi

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit (Rust)
        run: cargo audit
        working-directory: src-tauri
        continue-on-error: ${{ github.event_name == 'pull_request' }}
