name: Claude Code + Codex Review
on:
  schedule:
    - cron: "30 * * * *"   # hourly at :30 (offset from claude.yml at :00)
  workflow_dispatch:       # manual trigger from Actions tab

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: cc-audit-fix
      cancel-in-progress: false
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm and dependencies
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Find open audit issues
        id: find-issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pick only the oldest open audit issue (ascending by created date, take first)
          NUMBER=$(gh issue list --state open --label audit \
            --json number,createdAt,labels \
            --jq '[.[] | select(([.labels[].name] | any(. == "fix-attempted" or . == "needs-human")) | not)] | sort_by(.createdAt) | .[0].number // empty')
          echo "ISSUE_NUMBERS=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fix audit issue with Codex review gate
        if: steps.find-issues.outputs.ISSUE_NUMBERS != ''
        uses: anthropics/claude-code-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          allowed_bots: "claude[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PAT_TOKEN || github.token }}
          show_full_output: true
          claude_args: "--model claude-opus-4-6 --max-turns 30 --allowedTools Bash(git:*),Bash(gh:*),Bash(pnpm:*),Bash(npm:*),Bash(cargo:*),Bash(node:*),Bash(codex:*),Read,Write,Edit,Glob,Grep,MultiEdit"
          prompt: |
            Fix audit issue #${{ steps.find-issues.outputs.ISSUE_NUMBERS }}.

            1. Read the issue: `gh issue view ${{ steps.find-issues.outputs.ISSUE_NUMBERS }}`
            2. Create a fix branch: `git checkout -b fix/audit-${{ steps.find-issues.outputs.ISSUE_NUMBERS }}`
            3. Apply the minimum correct fix described in the issue
            4. Run full gates BEFORE committing:
               a. `pnpm build`
               b. If the fix touches .rs files: `cargo check --manifest-path src-tauri/Cargo.toml`
               c. If tests are relevant: `pnpm test:run`
               All gates must pass before proceeding. If gates fail after 2 attempts,
               comment on the issue and stop.
            5. Commit: `git commit -m "fix: <issue title> (Closes #${{ steps.find-issues.outputs.ISSUE_NUMBERS }})"`

            6. Run Codex review on the fix:
               ```bash
               codex review --base master
               ```
               - **Only act on critical, high, and medium severity findings. Ignore low
                 severity findings entirely.**
               - If output is empty, or only contains low severity findings → proceed to step 7
               - If critical/high/medium bugs are found:
                 - Fix each one
                 - Re-run full gates (step 4a–4c) — all must pass before continuing
                 - Amend the commit: `git commit --amend --no-edit`
                 - Re-run Codex review
               - Repeat at most 2 Codex review iterations. If critical/high/medium findings
                 STILL remain after 2 iterations, do NOT push a branch or open a PR. Instead:
                 add the labels `fix-attempted` and `needs-human` to the issue
                 (`gh issue edit N --add-label fix-attempted --add-label needs-human`),
                 comment summarising the unresolved findings, and stop. An auto-mergeable PR
                 must never be created while medium-or-higher findings are unresolved.

            7. Push branch: `git push origin fix/audit-${{ steps.find-issues.outputs.ISSUE_NUMBERS }}`
            8. Open PR:
                ```bash
                gh pr create \
                  --title "fix: <issue title>" \
                  --body "Closes #${{ steps.find-issues.outputs.ISSUE_NUMBERS }}" \
                  --label audit
                ```

            Rules:
            - Apply minimum correct fix — don't refactor beyond the finding
            - If a fix requires touching more than 3 files, comment on the issue
              explaining why and skip (leave for human review)
            - If build/test gates fail after 2 attempts, comment on the issue and move on
            - Never commit to master directly
            - IMPORTANT: if you ever merge directly to master instead of via PR, you MUST
              include "Closes #N" in the merge commit message (not just the branch commit).
              GitHub only fires the issue-close webhook for the PR body or newly-pushed
              commits — commits already known to the remote are not re-evaluated.

      - name: Flag unfixable issue on failure (WI-2 brake)
        if: failure() && steps.find-issues.outputs.ISSUE_NUMBERS != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${{ steps.find-issues.outputs.ISSUE_NUMBERS }}"
          gh issue edit "$N" --add-label fix-attempted || true
          gh issue comment "$N" --body "🤖 Autonomous fix run failed (gates, timeout, or unresolved review findings). Labeled \`fix-attempted\` and skipped from the loop. Needs human triage." || true
