name: Claude Code + Codex Review
on:
  # MANUAL ONLY: the hourly schedule was removed to cut Actions spend. Run it from
  # the Actions tab when you want a fix pass. There is deliberately NO auto-merge
  # step — a human reviews the result and merges.
  workflow_dispatch:       # manual trigger from Actions tab

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: cc-audit-fix
      cancel-in-progress: false
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm and dependencies
        run: |
          npm install -g pnpm@10
          pnpm install --frozen-lockfile

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Find open audit issues
        id: find-issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pick only the oldest open audit issue (ascending by created date, take first)
          NUMBER=$(gh issue list --state open --label audit \
            --json number,createdAt,labels \
            --jq '[.[] | select(([.labels[].name] | any(. == "fix-attempted" or . == "needs-human")) | not)] | sort_by(.createdAt) | .[0].number // empty')
          echo "ISSUE_NUMBERS=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fix audit issue with Codex review gate
        if: steps.find-issues.outputs.ISSUE_NUMBERS != ''
        uses: anthropics/claude-code-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          allowed_bots: "claude[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PAT_TOKEN || github.token }}
          show_full_output: true
          claude_args: "--model claude-opus-4-6 --max-turns 50 --allowedTools Bash(git:*),Bash(gh:*),Bash(pnpm:*),Bash(npm:*),Bash(cargo:*),Bash(node:*),Bash(codex:*),Bash(bash .github/scripts/pre-pr-gates.sh:*),Read,Write,Edit,Glob,Grep,MultiEdit"
          prompt: |
            Fix audit issue #${{ steps.find-issues.outputs.ISSUE_NUMBERS }}.

            1. Read the issue: `gh issue view ${{ steps.find-issues.outputs.ISSUE_NUMBERS }}`
            1a. VERIFY THE FINDING IS STILL VALID before touching anything. Inspect the
                cited file/line. If the code ALREADY satisfies the fix (the issue is
                stale / already resolved / not reproducible), comment on the issue
                explaining what you found and CLOSE it
                (`gh issue close ${{ steps.find-issues.outputs.ISSUE_NUMBERS }} --reason completed --comment "<why it's already addressed>"`),
                then STOP — do NOT create a branch, commit, or PR. Closing it removes
                it from the queue so the loop does not re-select it every run. Only
                continue to step 2 if the finding is real and unaddressed.
            2. Create a fix branch: `git checkout -b fix/audit-${{ steps.find-issues.outputs.ISSUE_NUMBERS }}`
            3. Apply the minimum correct fix described in the issue.
               For any fix that changes .ts/.tsx/.rs source, ALSO add a regression
               test that FAILS without the fix and PASSES with it (TDD rule 10):
               co-locate a `*.test.ts` for frontend logic, or an inline
               `#[cfg(test)]` test for Rust. Only if the change is genuinely
               test-exempt (type-only, or a pure refactor of already-covered code)
               may you skip the test — in that case record the reason as
               `[no-regression-test: <reason>]` in the commit message instead.
            4. Run full gates BEFORE committing:
               a. `pnpm build`
               b. If the fix touches .rs files: `cargo check --manifest-path src-tauri/Cargo.toml`
               c. If tests are relevant: `pnpm test:run`
               All gates must pass before proceeding. If gates fail after 2 attempts,
               comment on the issue and stop.
            5. Commit: `git commit -m "fix: <issue title> (Closes #${{ steps.find-issues.outputs.ISSUE_NUMBERS }})"`

            6. Run Codex review on the fix:
               ```bash
               codex review --base master
               ```
               - **Only act on critical, high, and medium severity findings. Ignore low
                 severity findings entirely.**
               - If output is empty, or only contains low severity findings → proceed to step 7
               - If critical/high/medium bugs are found:
                 - Fix each one
                 - Re-run full gates (step 4a–4c) — all must pass before continuing
                 - Amend the commit: `git commit --amend --no-edit`
                 - Re-run Codex review
               - Repeat at most 2 Codex review iterations. If critical/high/medium findings
                 STILL remain after 2 iterations, do NOT push a branch or open a PR. Instead:
                 add the labels `fix-attempted` and `needs-human` to the issue
                 (`gh issue edit N --add-label fix-attempted --add-label needs-human`),
                 comment summarising the unresolved findings, and stop. An auto-mergeable PR
                 must never be created while medium-or-higher findings are unresolved.

            7. Run the deterministic pre-PR gates — they MUST pass before pushing:
               ```bash
               bash .github/scripts/pre-pr-gates.sh master
               ```
               - GATE 1 (regression test) fails → you skipped the test from step 3.
                 Add it (or amend the commit with a `[no-regression-test: <reason>]`
                 exemption if genuinely test-exempt), re-run step 4 gates, re-run.
               - GATE 2 (sibling scan) fails → review the candidate siblings it
                 printed. For the bug class you fixed, write `.pre-pr/sibling-scan.md`
                 (use the Write tool — it creates the dir; the path is gitignored so
                 it is NOT committed) listing which sibling call-sites share the bug
                 and were fixed, and which are not affected (one-line reason each).
                 If a genuine sibling has the SAME bug and fixing it keeps the change
                 within the 3-file cap, fix it now (add its test, re-run step 4 gates,
                 amend the commit); if it would exceed the cap, record it in the note
                 as a follow-up. Then re-run the gate.
               - If the gates STILL fail after 2 attempts, do NOT push or open a PR:
                 add labels `fix-attempted` + `needs-human`, comment why, and stop.
            8. Push branch: `git push origin fix/audit-${{ steps.find-issues.outputs.ISSUE_NUMBERS }}`
            9. Open PR — fold the sibling-scan summary into the body:
                ```bash
                gh pr create \
                  --title "fix: <issue title>" \
                  --body "Closes #${{ steps.find-issues.outputs.ISSUE_NUMBERS }}

                ## Sibling scan
                <paste the contents of .pre-pr/sibling-scan.md here>" \
                  --label audit
                ```

            Rules:
            - Apply minimum correct fix — don't refactor beyond the finding
            - If a fix requires touching more than 3 files, comment on the issue
              explaining why and skip (leave for human review)
            - If build/test gates fail after 2 attempts, comment on the issue and move on
            - Never commit to master directly
            - IMPORTANT: if you ever merge directly to master instead of via PR, you MUST
              include "Closes #N" in the merge commit message (not just the branch commit).
              GitHub only fires the issue-close webhook for the PR body or newly-pushed
              commits — commits already known to the remote are not re-evaluated.

      - name: Flag unfixable issue on failure (WI-2 brake)
        if: failure() && steps.find-issues.outputs.ISSUE_NUMBERS != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${{ steps.find-issues.outputs.ISSUE_NUMBERS }}"
          gh issue edit "$N" --add-label fix-attempted || true
          gh issue comment "$N" --body "🤖 Autonomous fix run failed (gates, timeout, or unresolved review findings). Labeled \`fix-attempted\` and skipped from the loop. Needs human triage." || true
