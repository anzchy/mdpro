# cargo-audit configuration (D237, ADR-0107, ADR-0167). Read by `cargo audit` run from
# src-tauri/, locally and in ci.yml's rust-audit job.
#
# Every ignore names its advisory, the reason it does not reach mdpro, and
# what removes it. Reachability for RUSTSEC-2026-0189 comes from
# mdpro-codex-audit's read-only triage of 2026-10-15
# (~/.mdpro-redesign/prep/d237-cargo-audit-triage.md, summarised in the D237
# row of docs/plans/20260912-frontend-backend-sequencing-order.md). For
# RUSTSEC-2026-0462, the feature tree and lockfile show no HTTP client transport.
# tests/tooling/ci-workflow-gate.test.ts pins this list.

[advisories]
ignore = [
  # rmcp 0.14.0: DNS rebinding in the Streamable HTTP server transport.
  # Not compiled: Cargo.toml enables only rmcp's `server` + `transport-io`
  # features, never `transport-streamable-http-server`; the mdpro_mcp sidecar
  # talks stdio, and http_server.rs is mdpro's own axum server. There is no
  # 0.14.x fix. Removed by the rmcp 3.x major bump (>= 3.9.0).
  "RUSTSEC-2026-0189",
  # rmcp 0.14.0: unbounded response-body buffering in Streamable HTTP clients.
  # Not compiled: the client module needs `transport-streamable-http-client`,
  # and its reqwest implementation needs `transport-streamable-http-client-reqwest`;
  # neither is enabled. The mdpro_mcp sidecar talks stdio. There is no 0.14.x
  # fix; removed by the rmcp 3.x major bump (>= 3.9.0).
  "RUSTSEC-2026-0462",
]
