[package]
name = "tauri-app"
version = "0.3.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# The default `zip` feature is off (D274, ADR-0122): it only unpacks Tauri v1
# update bundles, which mdpro never publishes, and it pulled in `zip` 4.x with
# RUSTSEC-2026-0367/0368/0369. The other two defaults are kept as they were.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
pulldown-cmark = "0.11"
ammonia = "4"
notify = "6"
# File identity for the off-Unix stability proof (ADR-0093); already in the
# graph through notify -> walkdir.
same-file = "1.0.6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
base64 = "0.22"

# MCP Server dependencies
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
rmcp = { version = "0.14", features = ["server", "transport-io"] }
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
dirs = "5"
# getuid / getpwuid_r for the verify-run guard (ADR-0047 WI-002).
libc = "0.2"

# The D16 native terminate hook (ADR-0025) and its timeout alert (ADR-0027).
# These versions must unify with the ones tao already resolves: a second
# semver-compatible `objc2` would make `class_addMethod` register against a
# different runtime binding, and it would compile and pass every test.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
] }

# The paused clock (`start_paused`, `time::advance`) for the ADR-0042
# confirmation broker's 60 s deadline tests. A feature on the existing tokio
# dependency, not a new crate.
[features]
# D294 bounded device comparison. Explicit opt-in only; release builds retain
# the acknowledged main-thread hide unless this diagnostic is requested.
d294-diag-no-hide = []
# ADR-0047 WI-002: the agent-verification launch guard. Default off; only the
# verify build turns it on, and a feature-off build carries no guard code.
verify-run = []
# ADR-0047 WI-009: the agent control channel. Default off; implies the guard,
# so it only ever runs inside a verified run dir. The AppKit types it uses are
# already compiled through `objc2-app-kit`'s default features, so the gate is
# the module's cfg, not a dependency feature.
control-channel = ["verify-run"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "tauri-app"
path = "src/main.rs"

[[bin]]
name = "mdpro_mcp"
path = "src/bin/mdpro_mcp.rs"
